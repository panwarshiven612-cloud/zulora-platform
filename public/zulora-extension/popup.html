<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zulora AI Computer Plugin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      padding: 14px 16px;
      color: white;
    }
    .header h1 { font-size: 14px; font-weight: 800; }
    .header p  { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .status-row {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #94a3b8;
    }
    .dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .instructions {
      padding: 12px 16px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.6;
    }
    .instructions strong { color: #0f172a; }
    .footer {
      padding: 10px 16px;
      font-size: 10px;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔌 Zulora AI Computer Plugin</h1>
    <p>Browser Automation Agent</p>
  </div>
  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="statusText">Checking connection…</span>
  </div>
  <div class="instructions">
    <strong>How to use:</strong><br/>
    1. Open <strong>Zulora AI</strong> in a tab.<br/>
    2. Click <strong>🔌 Computer Plugin</strong> button.<br/>
    3. Type your task — Zulora does the rest!<br/><br/>
    Tasks run silently in background tabs.
  </div>
  <div class="footer">Zulora AI Computer Plugin v1.0.0</div>

  <script src="popup.js"></script>
</body>
</html>
