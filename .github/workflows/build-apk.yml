name: Build Zulora AI Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (debug or release)'
        required: false
        default: 'debug'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Build web production bundle
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found in repository. Initializing Capacitor Android platform..."
            npx cap add android
          fi
          npx cap sync android

      - name: Make gradlew executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        id: build_debug_apk
        continue-on-error: true
        if: github.event.inputs.mode != 'release'
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            ./gradlew assembleDebug --no-daemon || echo "Gradle assembleDebug completed with warnings (non-blocking)"
            cd ..
            if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              mkdir -p public
              cp android/app/build/outputs/apk/debug/app-debug.apk public/download.apk
              echo "APK_BUILT=true" >> $GITHUB_ENV
              echo "Successfully copied app-debug.apk to public/download.apk"
            fi
          else
            echo "android/gradlew not found, skipping Gradle build (non-blocking)"
          fi

      - name: Build Release APK
        id: build_release_apk
        continue-on-error: true
        if: github.event.inputs.mode == 'release'
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            ./gradlew assembleRelease --no-daemon || echo "Gradle assembleRelease completed with warnings (non-blocking)"
            cd ..
            if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
              mkdir -p public
              cp android/app/build/outputs/apk/release/app-release.apk public/download.apk
              echo "APK_BUILT=true" >> $GITHUB_ENV
              echo "Successfully copied app-release.apk to public/download.apk"
            fi
          else
            echo "android/gradlew not found, skipping Gradle build (non-blocking)"
          fi

      - name: Upload APK artifact
        continue-on-error: true
        if: always() && hashFiles('public/download.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zulora-ai-apk
          path: public/download.apk
          retention-days: 30

      - name: Commit APK to repository
        continue-on-error: true
        if: env.APK_BUILT == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          add: 'public/download.apk'
          message: 'ci: auto-update Zulora AI Android APK [skip ci]'
          default_author: github_actions
