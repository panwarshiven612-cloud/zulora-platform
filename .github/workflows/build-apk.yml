name: Build Zulora AI Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (debug or release)'
        required: false
        default: 'debug'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web production bundle
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: github.event.inputs.mode != 'release'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../public
          cp app/build/outputs/apk/debug/app-debug.apk ../public/download.apk
          echo "APK_PATH=public/download.apk" >> $GITHUB_ENV

      - name: Build Release APK
        if: github.event.inputs.mode == 'release'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../public
          cp app/build/outputs/apk/release/app-release.apk ../public/download.apk
          echo "APK_PATH=public/download.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zulora-ai-apk
          path: public/download.apk
          retention-days: 30

      - name: Commit APK to repository
        uses: EndBug/add-and-commit@v9
        with:
          add: 'public/download.apk'
          message: 'ci: auto-update Zulora AI Android APK [skip ci]'
          default_author: github_actions
